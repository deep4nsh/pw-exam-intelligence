name: "24/7 Official Exam Intelligence Radar"

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime
  schedule:
    - cron: '*/10 * * * *' # 24/7 automated cloud cron runner (never sleeps)

concurrency:
  group: exam-intelligence-scrape
  cancel-in-progress: false

jobs:
  scrape-and-alert:
    name: "Scrape Official PSC Portals & Dispatch Alerts"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Run Official Commissions, Judiciary & ADA Scrapers"
        env:
          GOOGLE_WEBAPP_URL: ${{ secrets.GOOGLE_WEBAPP_URL }}
          NODE_OPTIONS: "--openssl-legacy-provider"
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          node scraper/official_scrapers.js

      - name: "Persist Deduplication Cache & Notices Database"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp scraper/latest_official_notices.json dashboard/public/notices.json 2>/dev/null || true
          cp scraper/latest_official_notices.json dashboard/src/data/notices.json 2>/dev/null || true
          cp scraper/latest_official_notices.json dist/notices.json 2>/dev/null || true
          git add scraper/seen_hashes.json scraper/seen_hashes_praphul.json scraper/latest_official_notices.json dashboard/public/notices.json dashboard/src/data/notices.json dist/notices.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(radar): sync verified official circulars [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ Successfully synced new circulars to repository."
          else
            echo "ℹ️ No changes in circular cache. Everything up to date."
          fi
